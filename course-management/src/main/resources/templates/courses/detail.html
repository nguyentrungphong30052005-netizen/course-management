<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2 class="mb-3" th:text="${course.name}"></h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${warningMessage}" class="alert alert-warning" th:text="${warningMessage}"></div>

    <div class="card p-4 mb-4">
        <p><strong>Loại khóa học:</strong> <span th:text="${course.category.name}"></span></p>
        <p><strong>Học phí:</strong> <span th:text="${course.tuitionFee}"></span> VNĐ</p>
        <p><strong>Thời lượng:</strong> <span th:text="${course.duration}"></span> giờ (<span th:text="${course.durationType}"></span>)</p>
        <p><strong>Trạng thái:</strong> <span th:text="${course.isActive ? 'Đang tuyển sinh' : 'Ngừng tuyển sinh'}"></span></p>
        <p><strong>Mô tả:</strong> <span th:text="${course.description}"></span></p>
    </div>

    <!-- Quản lý ảnh khóa học -->
    <h4 class="mb-3">Thư viện ảnh khóa học</h4>
    
    <!-- Form thêm ảnh bằng URL -->
    <form th:action="@{/courses/{id}/images/add(id=${course.id})}" method="post" class="row g-3 mb-4 p-3 border rounded bg-light">
        <div class="col-md-6">
            <label class="form-label">Đường dẫn ảnh (URL)</label>
            <input type="text" name="imageUrl" class="form-control" placeholder="https://example.com/image.jpg" required>
        </div>
        <div class="col-md-3 d-flex align-items-center">
            <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" name="isThumbnail" value="true" id="thumbCheck">
                <label class="form-check-label" for="thumbCheck">Đặt làm ảnh đại diện</label>
            </div>
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Thêm ảnh</button>
        </div>
    </form>

    <!-- Hiển thị danh sách ảnh -->
    <div class="row">
        <div class="col-md-4 mb-3" th:each="img : ${course.images}">
            <div class="card h-100">
                <img th:src="${img.imageUrl}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="Course Image">
                <div class="card-body text-center">
                    <span class="badge bg-success mb-2" th:if="${img.isThumbnail}">Ảnh đại diện</span>
                    <form th:action="@{/courses/images/{imageId}/set-thumbnail(imageId=${img.id})}" method="post">
                        <input type="hidden" name="courseId" th:value="${course.id}">
                        <button type="submit" class="btn btn-sm btn-outline-secondary" th:if="${!img.isThumbnail}">Chọn làm ảnh đại diện</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a href="/courses" class="btn btn-secondary">Quay lại danh sách</a>
    </div>
</body>
</html>
