<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2 class="mb-4">Danh sách Khóa học</h2>

        <!-- Nút thêm mới -->
        <a href="/courses/new" class="btn btn-success mb-3">+ Thêm mới khóa học</a>

        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Ảnh</th> <!-- Cột ảnh riêng -->
                        <th>Tên khóa học</th>
                        <th>Loại</th>
                        <th>Học phí</th>
                        <th>Thời lượng</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course : ${courses}">
                        <td th:text="${course.id}">1</td>
                        
                        <!-- Cột hiển thị hình ảnh thu nhỏ -->
                        <td>
                            <th:block th:with="thumb=${not #lists.isEmpty(course.images) ? course.images[0].imageUrl : null}">
                                <img th:if="${thumb != null and !thumb.isEmpty()}" 
                                     th:src="${thumb}" 
                                     alt="Course Image" 
                                     style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px;" />
                                <span th:if="${thumb == null or thumb.isEmpty()}" class="text-muted small">Chưa có ảnh</span>
                            </th:block>
                        </td>

                        <!-- Sửa đường dẫn từ /courses/detail/{id} thành /courses/{id} -->
                        <td>
                            <a th:href="@{/courses/{id}(id=${course.id})}" th:text="${course.name}">Tên khóa học</a>
                        </td>
                        <td th:text="${course.category != null ? course.category.name : ''}">Loại</td>
                        <td th:text="${#numbers.formatDecimal(course.tuitionFee, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}">Học phí</td>
                        <td th:text="${course.duration + ' giờ'}">Thời lượng</td>
                        <td>
                            <span th:if="${course.isActive}" class="badge bg-success">Đang tuyển sinh</span>
                            <span th:unless="${course.isActive}" class="badge bg-secondary">Ngừng tuyển sinh</span>
                        </td>
                        
                        <!-- Sửa đường dẫn từ /courses/detail/{id} thành /courses/{id} -->
                        <td>
                            <a th:href="@{/courses/{id}(id=${course.id})}" class="btn btn-info btn-sm text-white">Chi tiết & Ảnh</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
