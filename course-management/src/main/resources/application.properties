# Sử dụng H2 Database lưu trực tiếp xuống file trên máy (giữ lại dữ liệu khi tắt ứng dụng)
spring.datasource.url=jdbc:h2:file:./data/coursedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate tự động tạo/cập nhật cấu trúc bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình để Hibernate tạo bảng xong rồi mới chạy file data.sql chèn dữ liệu
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always